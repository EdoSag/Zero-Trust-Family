name: zerotrust_family
description: "Zero-Trust Family: end-to-end encrypted family location sharing and safety check-ins."
publish_to: none
version: 0.7.0+7

environment:
  sdk: ^3.9.0

# Builds SQLite3MultipleCiphers instead of plain SQLite, so the core's local
# stores are encrypted as whole files (see Zero-Trust-Core README, "Sync").
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Shared account, keys, sync, sharing, settings and look of every
  # Zero-Trust app. Core Dev 161e6d3 (has the family location tables the
  # app uses; same commit as zt_release_checks). Never add
  # cryptography_flutter: it breaks the core's key derivation.
  zero_trust_core:
    git:
      url: https://github.com/EdoSag/Zero-Trust-Core.git
      path: packages/zero_trust_core
      ref: 161e6d3f2d0fbe9dab713274e08a3243041a61de
  # The suite's sharing screens (invite by link or QR, join, members). Must
  # be the same commit as zero_trust_core.
  zt_sharing_ui:
    git:
      url: https://github.com/EdoSag/Zero-Trust-Core.git
      path: packages/zt_sharing_ui
      ref: 161e6d3f2d0fbe9dab713274e08a3243041a61de
  # Place model, "use my current location" and pasted map links (no Google
  # Play services). Same commit as zero_trust_core.
  zt_places:
    git:
      url: https://github.com/EdoSag/Zero-Trust-Core.git
      path: packages/zt_places
      ref: 161e6d3f2d0fbe9dab713274e08a3243041a61de
  flutter_riverpod: ^3.5.0
  supabase_flutter: ^2.9.0
  # Reset links from account emails (EmailLinks).
  app_links: ">=6.4.0 <8.0.0"
  flutter_dotenv: ^6.0.1
  intl: any
  url_launcher: ^6.3.1
  permission_handler: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  vector_map_tiles: ^8.0.0
  vector_map_tiles_pmtiles: ^1.5.0
  cryptography: ^2.7.0
  flutter_secure_storage: ^11.2.0
dev_dependencies:
  # Release checks every Zero-Trust app runs in CI (keys, sync, sign-in, app
  # setup, database). Independent of zero_trust_core, so it may be newer.
  # Core Dev, the merge that added the `family` app id to the release checks.
  zt_release_checks:
    git:
      url: https://github.com/EdoSag/Zero-Trust-Core.git
      path: packages/zt_release_checks
      ref: 161e6d3f2d0fbe9dab713274e08a3243041a61de
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
